
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: rgb(120, 96, 64);
            font-family: "Times New Roman", serif;
        }

        #formContainer {
            width: 420px;
            max-width: 95%;
            margin: 17px auto;
            background: white;
            border: 10px solid #082a80;
            border-radius: 30px;
            overflow: hidden;
        }

        .hero {
            height: 170px;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: center;
            position: relative;
            text-align: center;
            color: white;
        }

        .hero h1 {
            padding-top: 75px;
            margin: 0;
            font-size: 34px;
            text-shadow: 2px 2px 2px black;
        }

        .hero h2 {
            margin: 0;
            font-size: 27px;
            text-shadow: 2px 2px 2px black;
        }

        #closeBtn {
            position: absolute;
            top: 12px;
            left: 14px;
            padding: 2px 7px;
            font-size: 18px;
            cursor: pointer;
        }

        h3 {
            text-align: center;
            font-size: 19px;
            margin: 20px 0;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            row-gap: 20px;
            padding: 0 19px 20px;
            align-items: center;
        }

        #myForm > input {
            width: 170px;
            max-width: 100%;
            height: 22px;
        }

        .gender {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .gender input {
            margin: 0 3px 0 0;
        }

        .gender label {
            margin-right: 5px;
        }

        .full-row {
            grid-column: 1 / 3;
            text-align: center;
        }

        .full-row input {
            margin: 0;
        }

        .submit-row button {
            padding: 2px 7px;
            cursor: pointer;
        }

        .scriptures {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            height: 100px;
            background: #171717;
        }

        .scriptures img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            border-right: 4px solid white;
        }

        .scriptures img:last-child {
            border-right: none;
        }

        #output {
            width: 420px;
            max-width: 95%;
            margin: 15px auto;
        }
    </style>
</head>

<body>

    <div id="formContainer">

        <header class="hero">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </header>

        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">

            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div class="gender">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section class="full-row">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section class="full-row">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section class="full-row submit-row">
                <button type="submit">Submit</button>
            </section>

        </form>

        <footer class="scriptures">
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </footer>

    </div>

    <div id="output"></div>

    <script>
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });

        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
                <h3>Here is the data that would be sent to the server:</h3>
                <ul>
                    ${entries.map(item => `<li>${item}</li>`).join('')}
                </ul>
            `;
        });
    </script>

</body>
</html>
