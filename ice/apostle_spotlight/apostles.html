<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlight</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #E8ECED;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            width: 710px;
            max-width: 100%;
            min-height: 548px;
            margin: 0 auto;
            border: 7px solid black;
            border-radius: 30px;
            background-image: url("images/christus.webp");
            background-size: cover;
            background-position: center;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: white;
            font-size: 30px;
            font-weight: normal;
            margin: 8px 0 15px;
        }

        h2 {
            color: white;
            font-size: 21px;
            font-weight: normal;
            margin: 12px 0 8px;
        }

        .presidency {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-left: 90px;
        }

        .apostles {
            display: grid;
            grid-template-columns: repeat(4, 82px);
            justify-content: center;
            gap: 25px 18px;
            margin: 8px 0 30px 90px;
        }

        .presidency img {
            width: 110px;
            height: 110px;
        }

        .apostles img {
            width: 82px;
            height: 82px;
        }

        img {
            display: block;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid white;
            transition: border-color 0.3s, transform 0.3s;
        }

        img:hover {
            border-color: gold;
            transform: scale(1.1);
            cursor: pointer;
        }

        @media screen and (max-width: 550px) {
            .container {
                min-height: 0;
            }

            .presidency {
                margin-left: 0;
                gap: 8px;
            }

            .presidency img {
                width: 75px;
                height: 75px;
            }

            .apostles {
                margin-left: 0;
                grid-template-columns: repeat(4, 60px);
                gap: 14px 8px;
            }

            .apostles img {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <h1>First Presidency</h1>

        <div class="presidency">
            <img src="images/oaks.webp" alt="Dallin H. Oaks">
            <img src="images/eyring.webp" alt="Henry B. Eyring">
            <img src="images/uchtdorf.webp" alt="Dieter F. Uchtdorf">
        </div>

        <h2>Quorum of the Twelve Apostles</h2>

        <div class="apostles">
            <img src="images/uchtdorf.webp" alt="Dieter F. Uchtdorf">
            <img src="images/bednar.webp" alt="David A. Bednar">
            <img src="images/cook.webp" alt="Quentin L. Cook">
            <img src="images/christofferson.webp" alt="D. Todd Christofferson">

            <img src="images/anderson.webp" alt="Neil L. Andersen">
            <img src="images/rasband.webp" alt="Ronald A. Rasband">
            <img src="images/stevenson.webp" alt="Gary E. Stevenson">
            <img src="images/renlund.webp" alt="Dale G. Renlund">

            <img src="images/gong.webp" alt="Gerrit W. Gong">
            <img src="images/soares.webp" alt="Ulisses Soares">
            <img src="images/kearon.webp" alt="Patrick Kearon">
            <img src="images/causse.webp" alt="Gerald Causse">
        </div>

    </main>
</body>
</html>
